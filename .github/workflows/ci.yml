# The Node matrix runs the same suite `bash scripts/test.sh` runs locally: unit tests, the
# cross-module import checker, and the credential scanner over the whole diff/repo. Those checks
# are deterministic and do not start Podman, Harbor or providers. The separate Python contract
# job installs the pinned Harbor package, then runs only offline tests against its imports.
#
# Matrix across the three OSes this kit claims to support (see docs/ENGENHARIA.md §2): the
# `node --test`, `check-imports.mjs` and `scan-secrets.sh` are the portable checks in this matrix.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # v4 targets Node 20, which GitHub deprecated -- every run was annotated with
      # "being forced to run on Node.js 24" and that shim eventually goes away.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Unit tests (node:test)
        run: node --test scripts/lib/*.test.ts

      - name: Import checker (backend + GUI, cross-module + cycles)
        run: node scripts/check-imports.mjs

      # bash ships on all three GitHub-hosted runners (Git Bash on windows-latest), matching the
      # cross-platform contract in docs/ENGENHARIA.md §2 -- one hook implementation, no PS variant.
      - name: Credential scan
        shell: bash
        run: bash scripts/scan-secrets.sh

  python-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned Harbor contract
        run: pip install harbor==0.22.0

      - name: Python contract tests (offline)
        env:
          PYTHONPATH: scripts/python
        run: python -m unittest discover -s scripts/python -p 'test_*.py'
